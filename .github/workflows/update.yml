name: Refresh public market data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public data
        id: refresh
        continue-on-error: true
        run: python update_data.py
      - name: Commit successfully fetched data
        run: |
          git add -A data/
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update public market data'
            git push
          else
            echo 'No data changes to commit.'
          fi
      - name: Report refresh failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'One or more sources failed. Inspect the update logs.' >&2
          exit 1
